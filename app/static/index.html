<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapas conceptuales</title><link rel="stylesheet" href="/static/styles.css"><script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js" defer></script><script src="/static/app.js" defer></script></head><body><main><header><p class="eyebrow">Estudiá visualmente</p><h1>Convertí tus apuntes en un mapa conceptual</h1><p>Subí un PDF con texto seleccionable o pegá tus apuntes. El material se procesa de forma efímera y se envía al proveedor de IA.</p></header><section class="panel"><form id="material-form" novalidate><label for="pdf">Archivo PDF <span id="pdf-limit">(máximo 20 MB)</span></label><input id="pdf" name="pdf" type="file" accept="application/pdf"><div class="or">o</div><label for="text">Pegá el texto <span id="text-limit"></span></label><textarea id="text" name="text" rows="8" placeholder="Pegá acá tus apuntes..."></textarea><p id="validation" role="alert"></p><button id="submit" type="submit">Generar mapa</button></form></section><section id="status" class="status" aria-live="polite">Elegí una fuente para empezar.</section><section id="result" hidden><div class="toolbar"><button id="zoom-in" type="button" aria-label="Acercar">＋</button><button id="zoom-out" type="button" aria-label="Alejar">−</button><button id="reset" type="button">Restablecer vista</button><button id="download" type="button" disabled>Descargar PNG</button></div><div id="network" tabindex="0" aria-label="Mapa conceptual interactivo"></div></section></main></body></html>
